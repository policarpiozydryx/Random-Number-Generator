<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevent default number input spinners for a cleaner appearance */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      appearance: textfield;
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">
  <div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-center mb-6 text-gray-900">Random Number Generator</h1>
    
    <div class="space-y-4">
      <div>
        <label for="min-val" class="block text-sm font-medium text-gray-700 mb-1">Minimum</label>
        <input 
          type="number" 
          id="min-val" 
          value="1" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-400 text-sm"
          placeholder="e.g. 1"
        >
      </div>

      <div>
        <label for="max-val" class="block text-sm font-medium text-gray-700 mb-1">Maximum</label>
        <input 
          type="number" 
          id="max-val" 
          value="100" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-400 text-sm"
          placeholder="e.g. 100"
        >
      </div>

      <div id="error-message" class="text-xs text-red-600 hidden"></div>

      <button 
        id="generate-btn" 
        type="button"
        class="w-full bg-gray-900 text-white py-2 px-4 rounded-md font-medium text-sm hover:bg-gray-800 active:bg-black focus:outline-none"
      >
        Generate
      </button>

      <div class="pt-4 border-t border-gray-100 text-center">
        <span class="block text-xs uppercase tracking-wider text-gray-500 mb-1">Result</span>
        <div id="result-display" class="text-4xl font-bold text-gray-900 min-h-[48px] flex items-center justify-center">
          -
        </div>
      </div>
    </div>
  </div>

  <script>
    // Grab DOM elements
    const minInput = document.getElementById('min-val');
    const maxInput = document.getElementById('max-val');
    const generateBtn = document.getElementById('generate-btn');
    const resultDisplay = document.getElementById('result-display');
    const errorDisplay = document.getElementById('error-message');

    function generateRandomNumber() {
      // Clear previous error
      errorDisplay.textContent = '';
      errorDisplay.classList.add('hidden');

      const rawMin = minInput.value.trim();
      const rawMax = maxInput.value.trim();

      // Check for empty fields
      if (rawMin === '' || rawMax === '') {
        showError('Please enter both minimum and maximum values.');
        return;
      }

      const min = Math.ceil(Number(rawMin));
      const max = Math.floor(Number(rawMax));

      // Validate numeric validity
      if (Number.isNaN(min) || Number.isNaN(max)) {
        showError('Please enter valid integers.');
        return;
      }

      // Validate range constraints
      if (min > max) {
        showError('Minimum cannot be greater than maximum.');
        return;
      }

      // Generate random integer inclusive of min and max
      const randomInt = Math.floor(Math.random() * (max - min + 1)) + min;
      resultDisplay.textContent = randomInt;
    }

    // Helper to display error messages without alerts
    function showError(message) {
      errorDisplay.textContent = message;
      errorDisplay.classList.remove('hidden');
      resultDisplay.textContent = '-';
    }

    generateBtn.addEventListener('click', generateRandomNumber);

    // Allow Enter key to trigger generation
    [minInput, maxInput].forEach(input => {
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          generateRandomNumber();
        }
      });
    });
  </script>
</body>
</html>
